<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Trendz Login</title>

  <!-- Bootstrap 5 + Bootstrap Icons + Google Font -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --ink: #2b2226;
      --paper: #ffffff;
      --muted: #8a8a8a;
      --accent: #2b2226;
    }

    body {
      font-family: 'Poppins', sans-serif;
      min-height: 100vh;
      /* Replace the URL with your own background image */
      background:
        linear-gradient(rgba(0,0,0,.65), rgba(0,0,0,.65)),
        url('./images/cloud\ sky.webp') center/cover no-repeat,
        #1c1719;
      color: #fff;
    }

    /* ---------- Left side caption ---------- */
    .caption h1 { font-weight: 600; font-size: clamp(2rem, 4vw, 3.2rem); line-height: 1.15; }
    .caption p  { max-width: 28rem; color: rgba(255,255,255,.75); }

    /* ---------- Login card ---------- */
    .login-card {
      width: 100%;
      max-width: 360px;
      background: var(--paper);
      color: var(--ink);
      border-radius: 6px;
      overflow: visible;
      box-shadow: 0 20px 50px rgba(0,0,0,.45);
    }

    /* Curved cover with your photo */
    .cover {
      position: relative;
      height: 170px;
      background: #444 url('./images/Fly\ girl\ pic.jpg') center/cover no-repeat;
      border-radius: 6px 6px 50% 50% / 6px 6px 35% 35%;
    }
    .cover::after {            /* dark tint so the name stays readable */
      content: "";
      position: absolute; inset: 0;
      background: rgba(0,0,0,.25);
      border-radius: inherit;
    }

    /* Your photo (circle) */
    .avatar {
      position: absolute;
      left: 50%; bottom: -34px;
      transform: translateX(-50%);
      width: 72px; height: 72px;
      border-radius: 50%;
      border: 4px solid var(--paper);
      object-fit: cover;
      background: #ddd;
      z-index: 2;
    }
    .cover .name {
      position: absolute; z-index: 1;
      left: 0; right: 0; bottom: 38px;
      text-align: center; font-weight: 600; font-size: .9rem; color: #fff;
    }

    .form-area { padding: 52px 28px 24px; }
    .form-control {
      border: 0; border-bottom: 1px solid #ddd; border-radius: 0;
      padding: .6rem .2rem; font-size: .9rem; box-shadow: none;
    }
    .form-control:focus { border-color: var(--accent); box-shadow: none; }

    .btn-login {
      background: var(--accent); color: #fff;
      border-radius: 4px; font-weight: 500; letter-spacing: .05em;
      padding: .65rem;
    }
    .btn-login:hover, .btn-login:focus-visible { background: #000; color: #fff; }

    .small-links a { color: var(--ink); font-weight: 500; text-decoration: none; }
    .small-links a:hover { text-decoration: underline; }

    footer { font-size: .75rem; color: rgba(255,255,255,.55); }
  </style>
</head>
<body>

  <main class="container min-vh-100 d-flex align-items-center py-5">
    <div class="row w-100 align-items-center g-5">

      <!-- Side caption -->
      <section class="col-lg-6 caption text-center text-lg-start">
        <h1 class="mb-3">Heyy Hello!!! Welcome .... </h1>
        <p class="mb-0 mx-auto mx-lg-0">Sign in to pick up where you left off. Write your own short caption here.</p>
      </section>

      <!-- Login card -->
      <section class="col-lg-6 d-flex justify-content-center justify-content-lg-end">
        <div class="login-card">

          <div class="cover">
            <span class="name">MANJUSHA K</span>
            <!-- Put your own photo in images/me.jpg -->
            <img class="avatar" src="./images/2023-1838.53.My Docs.jpg" alt="Your photo"
                 onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 72 72%22><rect width=%2272%22 height=%2272%22 fill=%22%23ddd%22/><circle cx=%2236%22 cy=%2728%22 r=%2213%22 fill=%22%23999%22/><rect x=%2214%22 y=%2746%22 width=%2244%22 height=%2230%22 rx=%2222%22 fill=%22%23999%22/></svg>'">
          </div>

          <form class="form-area" id="loginForm" novalidate>
            <div class="mb-3">
              <label for="email" class="visually-hidden">Email/ Username</label>
              <input type="email" class="form-control" id="email" placeholder="Email/ Username" required autocomplete="email">
            </div>

            <div class="mb-4 position-relative">
              <label for="password" class="visually-hidden">Password</label>
              <input type="password" class="form-control pe-5" id="password" placeholder="Password" required autocomplete="current-password">
              <button type="button" class="btn btn-sm position-absolute top-50 end-0 translate-middle-y" id="togglePw" aria-label="Show password">
                <i class="bi bi-eye"></i>
              </button>
            </div>

            <button type="submit" class="btn btn-login w-100">LOGIN</button>

            <div class="small-links d-flex justify-content-between mt-3 small">
              <a href="#">Forgot password?</a>
              <span>Not a member? <a href="#">Join now</a></span>
            </div>
          </form>

        </div>
      </section>

    </div>
  </main>

  <footer class="text-center pb-4">&copy; 2026 Trendz. All rights reserved.</footer>

  <script>
    // Show / hide password
    const pw = document.getElementById('password');
    document.getElementById('togglePw').addEventListener('click', e => {
      const show = pw.type === 'password';
      pw.type = show ? 'text' : 'password';
      e.currentTarget.innerHTML = `<i class="bi ${show ? 'bi-eye-slash' : 'bi-eye'}"></i>`;
    });

    // Front-end only: connect this to your backend later
    document.getElementById('loginForm').addEventListener('submit', e => {
      e.preventDefault();
      if (!e.target.checkValidity()) { e.target.reportValidity(); return; }
      alert('Login form is ready. Connect it to your backend here.');
    });
  </script>
</body>
</html>
